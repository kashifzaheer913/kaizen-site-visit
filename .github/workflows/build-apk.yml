name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Icon, splash and signing key
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          pip install pillow
          python3 resources/prepare_android.py

      - name: Sync web files
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Build signed release (Play Store)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Release key secrets nahi hain, skip"; exit 0; fi
          cd android
          ./gradlew bundleRelease assembleRelease
          cp app/build/outputs/bundle/release/app-release.aab ../Kaizen-Play-Store.aab
          cp app/build/outputs/apk/release/app-release.apk ../Kaizen-Site-Visit-Signed.apk

      - name: Upload Play Store bundle
        if: ${{ hashFiles('Kaizen-Play-Store.aab') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Kaizen-Play-Store-AAB
          path: Kaizen-Play-Store.aab

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Kaizen-Site-Visit.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kaizen-Site-Visit-APK
          path: Kaizen-Site-Visit.apk

      - name: Publish release (direct APK link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK build ${{ github.run_number }}
          files: |
            Kaizen-Site-Visit.apk
            Kaizen-Site-Visit-Signed.apk
